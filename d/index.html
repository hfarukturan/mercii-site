<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sizce kim haklı? · Mercii</title>
  <meta name="description" content="Bu dava Mercii'de oylanıyor. Uygulamayı aç, kimin haklı olduğuna sen karar ver." />
  <meta property="og:title" content="Sizce kim haklı? · Mercii" />
  <meta property="og:description" content="Bu dava Mercii'de oylanıyor. Kimin haklı olduğuna sen karar ver." />
  <meta property="og:image" content="https://mercii.app/assets/app-icon.png" />
  <meta name="theme-color" content="#F6F0FB" />
  <link rel="icon" href="../assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #F6F0FB; --ink: #2A1640; --muted: #6B5B86; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: linear-gradient(160deg, #FBDCC8, #F6F0FB 45%, #E6DCFA);
      color: var(--ink); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; text-align: center;
    }
    main { width: 100%; max-width: 420px; }
    img { width: 150px; }
    .word { font-size: 40px; font-weight: 800; letter-spacing: -1px; margin: 4px 0 18px; }
    h1 { font-size: 28px; line-height: 1.15; margin: 0 0 10px; }
    p { color: var(--muted); margin: 0 0 26px; line-height: 1.55; }
    .btn { display: block; width: 100%; padding: 16px; border-radius: 16px; font-weight: 800; font-size: 17px; text-decoration: none; margin-bottom: 12px; }
    .primary { background: var(--ink); color: #fff; box-shadow: 0 10px 24px rgba(42, 22, 64, 0.25); }
    .secondary { background: #fff; color: var(--ink); border: 1px solid rgba(42, 22, 64, 0.1); }
    small { display: block; color: var(--muted); margin-top: 14px; font-size: 13px; }
    small a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <img src="../assets/logo.png" alt="" />
    <div class="word">mercii</div>
    <h1>Sizce kim haklı?</h1>
    <p>Bu dava Mercii'de oylanıyor. Uygulamayı aç, iki tarafı da oku ve kararını ver.</p>
    <a class="btn primary" id="open" href="mercii://">Uygulamada aç</a>
    <a class="btn secondary" href="https://testflight.apple.com/join/djtpc3PC">Uygulamayı indir (iPhone)</a>
    <small>Android sürümü çok yakında · <a href="../">mercii.app</a></small>
  </main>
  <script>
    // mercii.app/d/?id=<dava> → uygulamada o davayı aç.
    var id = new URLSearchParams(location.search).get('id');
    if (id && /^[0-9a-f-]{36}$/i.test(id)) document.getElementById('open').href = 'mercii://dava/' + id;
  </script>
</body>
</html>
